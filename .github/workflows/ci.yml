name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端与 CLI（wasm-gc 运行）要 Node
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      # 表与差分向量必须等于生成器产物：重新生成后工作区应零差异
      - name: 生成物新鲜度（表 + 向量 + fmt）
        run: |
          python3 tools/generate_tables.py
          python3 tools/gen_vectors.py
          moon fmt
          git diff --exit-code

      - name: 检查
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试
        run: moon test --target wasm-gc

      # 编解码是纯计算，js 后端应给出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      - name: 命令行端到端（成功路径 + 错误路径）
        run: |
          set -euo pipefail
          printf 'H\xe9llo \x80\x9f \xc9lan' > "$RUNNER_TEMP/in.bin"

          # decode：字节 -> UTF-8 文本
          moon run cmd/main --target wasm-gc -- decode windows-1252 \
            "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/out.txt"
          python3 -c 'import sys; t = open(sys.argv[1], encoding="utf-8").read(); assert t == "Héllo €Ÿ Élan", repr(t)' "$RUNNER_TEMP/out.txt"

          # encode：往返后与原始输入逐字节相同
          moon run cmd/main --target wasm-gc -- encode windows-1252 \
            "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/back.bin"
          cmp "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/back.bin"

          # 未知 label -> 非零退出
          if moon run cmd/main --target wasm-gc -- decode no-such-label \
            "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/x.txt"; then
            echo "expected failure for unknown label"; exit 1
          fi

          # 合法但未实现的编码 -> 非零退出且消息可读
          if moon run cmd/main --target wasm-gc -- decode gbk \
            "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/x.txt" > "$RUNNER_TEMP/e.txt"; then
            echo "expected failure for unimplemented encoding"; exit 1
          fi
          grep -q 'UnsupportedEncoding("GBK")' "$RUNNER_TEMP/e.txt"

          # 不可映射字符 -> 非零退出且报出码点与位置
          printf '中文' > "$RUNNER_TEMP/zh.txt"
          if moon run cmd/main --target wasm-gc -- encode windows-1252 \
            "$RUNNER_TEMP/zh.txt" "$RUNNER_TEMP/zh.bin" > "$RUNNER_TEMP/e.txt"; then
            echo "expected failure for unmappable characters"; exit 1
          fi
          grep -q 'Unmappable(20013, 0)' "$RUNNER_TEMP/e.txt"
