name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端与 CLI（wasm-gc 运行）要 Node
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 工具链跟随 latest：安装 CDN 只保留 latest/channel，历史版本一律 404，
      # 无法钉精确版本（已实测 0.1.20260920 / 0.1.20260901 / 0.1.0 全部 404）。
      # 编译器变化打挂 CI 时，以专门提交修复（见 135484a）。
      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      # 表与差分向量必须等于生成器产物：重新生成后工作区应零差异
      - name: 生成物新鲜度（表 + 向量 + fmt）
        run: |
          python3 tools/generate_tables.py
          python3 tools/gen_vectors.py
          moon fmt
          git diff --exit-code

      - name: 检查
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试
        run: moon test --target wasm-gc

      # 编解码是纯计算，js 后端应给出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      # E2E 的唯一来源是 tools/e2e.sh（本地门禁跑的也是它，杜绝两份副本漂移）
      - name: 命令行端到端（成功路径 + 错误路径）
        run: bash tools/e2e.sh
