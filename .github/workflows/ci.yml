name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端与 CLI（wasm-gc 运行）要 Node
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      # 表与差分向量必须等于生成器产物：重新生成后工作区应零差异
      - name: 生成物新鲜度（表 + 向量 + fmt）
        run: |
          python3 tools/generate_tables.py
          python3 tools/gen_vectors.py
          moon fmt
          git diff --exit-code

      - name: 检查
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试
        run: moon test --target wasm-gc

      # 编解码是纯计算，js 后端应给出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      - name: 命令行端到端（成功路径 + 错误路径）
        run: |
          set -euo pipefail
          printf 'H\xe9llo \x80\x9f \xc9lan' > "$RUNNER_TEMP/in.bin"

          # decode：字节 -> UTF-8 文本
          moon run cmd/main --target wasm-gc -- decode windows-1252 \
            "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/out.txt"
          python3 -c 'import sys; t = open(sys.argv[1], encoding="utf-8").read(); assert t == "Héllo €Ÿ Élan", repr(t)' "$RUNNER_TEMP/out.txt"

          # encode：往返后与原始输入逐字节相同
          moon run cmd/main --target wasm-gc -- encode windows-1252 \
            "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/back.bin"
          cmp "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/back.bin"

          # 未知 label -> 非零退出
          if moon run cmd/main --target wasm-gc -- decode no-such-label \
            "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/x.txt"; then
            echo "expected failure for unknown label"; exit 1
          fi

          # 合法但未实现的编码 -> 非零退出且消息可读
          if moon run cmd/main --target wasm-gc -- decode big5 \
            "$RUNNER_TEMP/in.bin" "$RUNNER_TEMP/x.txt" > "$RUNNER_TEMP/e.txt"; then
            echo "expected failure for unimplemented encoding"; exit 1
          fi
          grep -q 'UnsupportedEncoding("Big5")' "$RUNNER_TEMP/e.txt"

          # 不可映射字符 -> 非零退出且报出码点与位置
          printf '中文' > "$RUNNER_TEMP/zh.txt"
          if moon run cmd/main --target wasm-gc -- encode windows-1252 \
            "$RUNNER_TEMP/zh.txt" "$RUNNER_TEMP/zh.bin" > "$RUNNER_TEMP/e.txt"; then
            echo "expected failure for unmappable characters"; exit 1
          fi
          grep -q 'Unmappable(20013, 0)' "$RUNNER_TEMP/e.txt"

          # 跨编码端到端（F2 接线）：iso-8859-1 解出 -> iso-8859-2 编回同字节
          printf 'caf\xe9' > "$RUNNER_TEMP/latin.bin"
          moon run cmd/main --target wasm-gc -- decode iso-8859-1 \
            "$RUNNER_TEMP/latin.bin" "$RUNNER_TEMP/latin.txt"
          python3 -c 'import sys; t = open(sys.argv[1], encoding="utf-8").read(); assert t == "café", repr(t)' "$RUNNER_TEMP/latin.txt"
          moon run cmd/main --target wasm-gc -- encode iso-8859-2 \
            "$RUNNER_TEMP/latin.txt" "$RUNNER_TEMP/latin2.bin"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "636166e9", b.hex()' "$RUNNER_TEMP/latin2.bin"

          # koi8-r 原生字符集往返（该编码不含拉丁扩展字母），期望文本由 CPython 现算
          printf '\xf0\xe1\xe2' > "$RUNNER_TEMP/koi8r.bin"
          moon run cmd/main --target wasm-gc -- decode koi8-r \
            "$RUNNER_TEMP/koi8r.bin" "$RUNNER_TEMP/koi8r.txt"
          moon run cmd/main --target wasm-gc -- encode koi8-r \
            "$RUNNER_TEMP/koi8r.txt" "$RUNNER_TEMP/koi8r2.bin"
          cmp "$RUNNER_TEMP/koi8r.bin" "$RUNNER_TEMP/koi8r2.bin"
          python3 -c 'import sys; expect = bytes.fromhex("f0e1e2").decode("koi8_r"); t = open(sys.argv[1], encoding="utf-8").read(); assert t == expect, t.encode("utf-8").hex()' "$RUNNER_TEMP/koi8r.txt"

          # 中文端到端（F3 接线）：GBK 字节 -> UTF-8 文本 -> gb18030 字节（2 字节段逐字节相同）
          printf '\xd6\xd0\xce\xc4' > "$RUNNER_TEMP/cn.bin"
          moon run cmd/main --target wasm-gc -- decode gbk \
            "$RUNNER_TEMP/cn.bin" "$RUNNER_TEMP/cn.txt"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "e4b8ade69687", b.hex()' "$RUNNER_TEMP/cn.txt"
          moon run cmd/main --target wasm-gc -- encode gb18030 \
            "$RUNNER_TEMP/cn.txt" "$RUNNER_TEMP/cn2.bin"
          cmp "$RUNNER_TEMP/cn.bin" "$RUNNER_TEMP/cn2.bin"

          # gb18030 四字节真往返：U+1F600 <-> 4 字节 <-> UTF-8
          python3 -c 'import sys; open(sys.argv[1], "wb").write(chr(0x1F600).encode("gb18030"))' "$RUNNER_TEMP/astral.bin"
          moon run cmd/main --target wasm-gc -- decode gb18030 \
            "$RUNNER_TEMP/astral.bin" "$RUNNER_TEMP/astral.txt"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "f09f9880", b.hex()' "$RUNNER_TEMP/astral.txt"
          moon run cmd/main --target wasm-gc -- encode gb18030 \
            "$RUNNER_TEMP/astral.txt" "$RUNNER_TEMP/astral2.bin"
          cmp "$RUNNER_TEMP/astral.bin" "$RUNNER_TEMP/astral2.bin"

          # Big5 端到端（F4 接线）：你好 = a741 a66e，UTF-8 往返逐字节一致
          printf '\xa7\x41\xa6\x6e' > "$RUNNER_TEMP/hant.bin"
          moon run cmd/main --target wasm-gc -- decode big5 \
            "$RUNNER_TEMP/hant.bin" "$RUNNER_TEMP/hant.txt"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "e4bda0e5a5bd", b.hex()' "$RUNNER_TEMP/hant.txt"
          moon run cmd/main --target wasm-gc -- encode big5 \
            "$RUNNER_TEMP/hant.txt" "$RUNNER_TEMP/hant2.bin"
          cmp "$RUNNER_TEMP/hant.bin" "$RUNNER_TEMP/hant2.bin"

          # Shift_JIS 端到端：日本語 + 0x80（U+0080）+ 半角片假名（U+FF61）
          printf '\x93\xfa\x96\x7b\x8c\xea' > "$RUNNER_TEMP/ja.bin"
          moon run cmd/main --target wasm-gc -- decode shift_jis \
            "$RUNNER_TEMP/ja.bin" "$RUNNER_TEMP/ja.txt"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "e697a5e69cace8aa9e", b.hex()' "$RUNNER_TEMP/ja.txt"
          moon run cmd/main --target wasm-gc -- encode shift_jis \
            "$RUNNER_TEMP/ja.txt" "$RUNNER_TEMP/ja2.bin"
          cmp "$RUNNER_TEMP/ja.bin" "$RUNNER_TEMP/ja2.bin"
          printf '\x80\xa1' > "$RUNNER_TEMP/sjis_misc.bin"
          moon run cmd/main --target wasm-gc -- decode shift_jis \
            "$RUNNER_TEMP/sjis_misc.bin" "$RUNNER_TEMP/sjis_misc.txt"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "c280efbda1", b.hex()' "$RUNNER_TEMP/sjis_misc.txt"
          moon run cmd/main --target wasm-gc -- encode shift_jis \
            "$RUNNER_TEMP/sjis_misc.txt" "$RUNNER_TEMP/sjis_misc2.bin"
          cmp "$RUNNER_TEMP/sjis_misc.bin" "$RUNNER_TEMP/sjis_misc2.bin"

          # EUC-JP 端到端（F5 接线）：日本語，含 SS3 三字节序列
          printf '\xc6\xfc\xcb\xdc\xb8\xec' > "$RUNNER_TEMP/ja_euc.bin"
          moon run cmd/main --target wasm-gc -- decode euc-jp \
            "$RUNNER_TEMP/ja_euc.bin" "$RUNNER_TEMP/ja_euc.txt"
          python3 -c 'import sys; exp = "".join(chr(c).encode("utf-8").hex() for c in (0x65E5, 0x672C, 0x8A9E)); b = open(sys.argv[1], "rb").read(); assert b.hex() == exp, b.hex()' "$RUNNER_TEMP/ja_euc.txt"
          moon run cmd/main --target wasm-gc -- encode euc-jp \
            "$RUNNER_TEMP/ja_euc.txt" "$RUNNER_TEMP/ja_euc2.bin"
          cmp "$RUNNER_TEMP/ja_euc.bin" "$RUNNER_TEMP/ja_euc2.bin"
          printf '\x8f\xa2\xaf' > "$RUNNER_TEMP/ss3.bin"
          moon run cmd/main --target wasm-gc -- decode euc-jp \
            "$RUNNER_TEMP/ss3.bin" "$RUNNER_TEMP/ss3.txt"
          python3 -c 'import sys; b = open(sys.argv[1], "rb").read(); assert b.hex() == "cb98", b.hex()' "$RUNNER_TEMP/ss3.txt"

          # EUC-KR 端到端：韩国어（期望 UTF-8 由 CPython 现算，避免手写 hex）
          printf '\xc7\xd1\xb1\xb9\xbe\xee' > "$RUNNER_TEMP/ko.bin"
          moon run cmd/main --target wasm-gc -- decode euc-kr \
            "$RUNNER_TEMP/ko.bin" "$RUNNER_TEMP/ko.txt"
          python3 -c 'import sys; exp = "".join(chr(c).encode("utf-8").hex() for c in (0xD55C, 0xAD6D, 0xC5B4)); b = open(sys.argv[1], "rb").read(); assert b.hex() == exp, b.hex()' "$RUNNER_TEMP/ko.txt"
          moon run cmd/main --target wasm-gc -- encode euc-kr \
            "$RUNNER_TEMP/ko.txt" "$RUNNER_TEMP/ko2.bin"
          cmp "$RUNNER_TEMP/ko.bin" "$RUNNER_TEMP/ko2.bin"
